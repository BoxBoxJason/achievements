baseURL = "https://boxboxjason.github.io/achievements/"
title = "Achievements"
locale = "en-US"

# "Last updated" dates on pages come from git history, so CI must check out all of it.
enableGitInfo = true
enableRobotsTXT = true

# Hugo does not merge `markup` from a theme: keep this block in every site.
[markup]
  [markup.highlight]
    noClasses = false

# Look and feel (colours, favicon, footer, search, ...) come from the shared theme,
# which is the same for every documentation site. Only project specifics live here.
[module]
  [[module.imports]]
    path = "github.com/boxboxjason/hugo-theme"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  # The getting started walkthrough shown inside VS Code is rendered on the site too,
  # from the same files, and so is the panel animation.
  [[module.mounts]]
    source = "walkthroughs"
    target = "assets/walkthroughs"
  [[module.mounts]]
    source = "."
    target = "static/images"
    files = ["achievements.gif"]

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Open VSX"
    url = "https://open-vsx.org/extension/BoxBoxJason/achievements"
    weight = 2
  [[menu.main]]
    name = "Search"
    weight = 3
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 4
    url = "https://github.com/boxboxjason/achievements"
    [menu.main.params]
      icon = "github"

[params]
  [params.editURL]
    base = "https://github.com/boxboxjason/achievements/edit/main/docs/content"
